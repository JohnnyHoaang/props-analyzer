services:
  postgres:
    image: postgres:16-alpine
    container_name: props-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: props_analyzer
      POSTGRES_PASSWORD: props_analyzer
      POSTGRES_DB: props_analyzer
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U props_analyzer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
